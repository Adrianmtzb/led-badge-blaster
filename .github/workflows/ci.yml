name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Los comandos de verdad viven en el Makefile, para que el CI ejecute
# exactamente lo mismo que ejecuta quien contribuye en su máquina.
env:
  BUILD_DIR: firmware/led_badge_blaster/build/m5stack.esp32.m5stack_atom

jobs:
  compilar:
    name: Compilar el firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      # El core de ESP32 pesa varios cientos de megas y tarda en bajar; sin
      # cache cada ejecución se iría en la instalación. La clave depende del
      # Makefile porque es donde están fijadas las versiones.
      - name: Cachear core y librerías
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Instalar el core y las librerías
        run: make deps

      - name: Compilar
        run: make build

      # boot_app0.bin no lo genera la compilación: viene con el core instalado.
      # El instalador web lo necesita como cuarta parte.
      - name: Añadir boot_app0.bin
        run: make bootapp0

      - name: Publicar los binarios
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ${{ env.BUILD_DIR }}/*.bin
          if-no-files-found: error

  instalador:
    name: Validar el instalador web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El instalador falla en silencio si el manifest no cuadra con lo que el
      # CI va a publicar, o si anuncia una version distinta a la del firmware.
      - name: Comprobar manifest y versión
        run: make check

  publicar:
    name: Publicar la release
    needs: [compilar, instalador]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/led_badge_blaster.ino.bin \
            dist/led_badge_blaster.ino.merged.bin

  pagina:
    name: Desplegar el instalador
    needs: [compilar, instalador]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      # Los binarios no viven en el repo: se arman aqui con los nombres que
      # espera el manifest, para que la pagina publicada nunca vaya por detras
      # del firmware.
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp docs/index.html docs/manifest.json docs/catalog.json _site/
          cp dist/led_badge_blaster.ino.bin              _site/led_badge_blaster.bin
          cp dist/led_badge_blaster.ino.bootloader.bin   _site/bootloader.bin
          cp dist/led_badge_blaster.ino.partitions.bin   _site/partitions.bin
          cp dist/boot_app0.bin                         _site/boot_app0.bin

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: desplegar
        uses: actions/deploy-pages@v5
